# Generated by nginx-shibboleth-toolkit.
# nginx cannot start FastCGI programs, so supervisor runs the Shibboleth
# authorizer and responder and restarts them if they crash.

[fcgi-program:shibauthorizer]
command=${SHIB_LIBEXEC}/shibauthorizer
socket=unix://${SOCKET_DIR}/shibauthorizer.sock
socket_owner=_shibd:${NGINX_GROUP}
socket_mode=0660
user=_shibd
autostart=true
autorestart=true
stdout_logfile=/var/log/shibboleth/authorizer.out.log
stderr_logfile=/var/log/shibboleth/authorizer.err.log

[fcgi-program:shibresponder]
command=${SHIB_LIBEXEC}/shibresponder
socket=unix://${SOCKET_DIR}/shibresponder.sock
socket_owner=_shibd:${NGINX_GROUP}
socket_mode=0660
user=_shibd
autostart=true
autorestart=true
stdout_logfile=/var/log/shibboleth/responder.out.log
stderr_logfile=/var/log/shibboleth/responder.err.log
