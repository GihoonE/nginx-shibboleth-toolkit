# Generated by nginx-shibboleth-toolkit. Include once in the HTTPS server block.

# shib_request sends a subrequest here; the authorizer answers 200 with the
# user's attributes, or a redirect to the IdP when there is no session.
location = /shibauthorizer {
    internal;
    include snippets/shibboleth/fastcgi-params.conf;
    fastcgi_pass unix:${SOCKET_DIR}/shibauthorizer.sock;
}

# SAML endpoints: login, assertion consumer, logout, Metadata, Status, Session.
location /Shibboleth.sso {
    include snippets/shibboleth/fastcgi-params.conf;
    fastcgi_pass unix:${SOCKET_DIR}/shibresponder.sock;
    fastcgi_param SCRIPT_FILENAME /Shibboleth.sso;
    fastcgi_param PATH_INFO $uri;
    fastcgi_param SERVER_NAME $server_name;
}
